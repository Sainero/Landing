# Галерея блоков для сайта: платёжный сервис (схема из текста, точечная диаграмма, айсберг).
title: Платёжный сервис — как устроено
lang: ru
# Тема — как у витрины Slideria (content/decks/slideria/deck.yaml): весь сайт в одном стиле
theme:
  accent: "#6366F1"
  accent2: "#EC4899"
  accentFlow: true

slides:
  - id: payment
    title: Как проходит {g:duo|оплата}
    badge: Схема из текста
    body:
      - type: diagram
        code: |
          нумерация
          актёр Покупатель
          Покупатель -> Магазин: «Оплатить»
          Магазин -> Шлюз: платёж 4 200 ₽
          Шлюз -> Банк: списание
          Банк --> Шлюз: одобрено
          заметка Шлюз, Банк: проверка антифродом
          == Чек ==
          Шлюз --> Магазин: успех
          Магазин --> Покупатель: чек на почту

  - id: latency
    title: Нагрузка и время {g:duo|ответа}
    badge: Точечная диаграмма
    body:
      - type: card
        body:
          type: scatter
          xLabel: Запросов в секунду, тыс.
          yLabel: Время ответа, мс
          trend: linear
          series:
            - { name: До оптимизации, points: [[1, 120], [2, 150], [3, 190], [4, 240], [5, 300], [6, 350], [7, 420]] }
            - { name: После, points: [[1, 60], [2, 66], [3, 74], [4, 80], [5, 90], [6, 96], [7, 104]] }

  - id: iceberg
    title: Что видит {g:duo|покупатель}
    badge: Айсберг
    body:
      - type: iceberg
        items:
          - { title: Кнопка «Оплатить», text: Одна секунда на экране }
          - { title: Платёжный шлюз, text: Антифрод и 3-D Secure }
          - { title: Очереди и повторы, text: Ни один платёж не теряется }
          - { title: Базы и резервные копии, text: Две площадки }
          - { title: Мониторинг, text: Дежурный инженер 24/7 }

  - id: cover
    template: cover
    title: Платёжный сервис
    lead: Как устроена оплата за одну секунду и почему она не теряется
    meta: Техническая встреча · команда платформы
    visual:
      type: gears
      items:
        - { title: Шлюз, text: приём платежей }
        - { title: Антифрод, text: проверка за 40 мс }
        - { title: Банк, text: списание }

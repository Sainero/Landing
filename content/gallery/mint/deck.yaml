# Галерея блоков для сайта: тема «Мята», история — школьный урок (тест, диаграмма Венна, формула с графиком).
title: Биология и физика — урок
lang: ru
fonts:
  - { name: Nunito, src: ./assets/Nunito.woff2 }
theme:
  accent: "#0D9488"
  accent2: "#34D399"
  font: Nunito
  head: Nunito
  headWeight: 800
  headSpacing: -0.01
  light: { bg: "#F1FAF7", tx: "#0F2A25", surf: "#FFFFFF", alt: "#E3F4EE", mu: "#557A70", bd: "#D3EBE3", bd2: "#B9DED2" }
  dark: { bg: "#08201B", tx: "#DDF6EF", surf: "#0E2B25", alt: "#051612", mu: "#86B5A8", bd: "#1A4038", bd2: "#24564B" }
  bg: dots
  cards: raised
  radius: 1.9

slides:
  - id: quiz
    title: Проверим {g:duo|себя}
    badge: Тест для зала
    body:
      - type: quiz
        question: Какой органоид называют «электростанцией» клетки?
        layout: grid
        points: 1
        options:
          - { text: Рибосома, note: Рибосома собирает белки }
          - { text: Митохондрия, correct: true }
          - { text: Ядро, note: Ядро хранит ДНК }
          - { text: Лизосома, note: Лизосома переваривает лишнее }
        note: В митохондриях из глюкозы получается энергия — АТФ
      - type: flashcards
        label: Термин
        items:
          - { front: Митоз, back: Деление клетки на две одинаковые }
          - { front: Осмос, back: Вода проходит через мембрану }
          - { front: Фотосинтез, back: Свет, вода и CO₂ → сахар и кислород }

  - id: venn
    title: Что общего у {g:duo|клеток}
    badge: Диаграмма Венна
    body:
      - type: venn
        center: Ядро и митохондрии
        variant: filled
        items:
          - { title: Растения, text: Хлоропласты и стенка из целлюлозы }
          - { title: Животные, text: Нет клеточной стенки }
          - { title: Грибы, text: Стенка из хитина }

  - id: fall
    template: canvas
    label: Свободное падение
    free:
      - { type: text, text: "Свободное {g:duo|падение}", styles: { text: { size: 44, weight: 800 } }, place: { x: 64, y: 40, w: 760 }, enter: fade }
      - { type: text, text: "Сдвиньте ползунок — формула, число и график пересчитаются при показе", styles: { text: { size: 17, color: text2 } }, place: { x: 66, y: 112, w: 760 }, enter: fade, delay: 100 }
      - { type: control, name: g, label: "Ускорение g: Луна 1,6 · Земля 9,8 · Юпитер 24,8", min: 1.6, max: 24.8, step: 0.1, value: 9.8, unit: " м/с²", place: { x: 64, y: 186, w: 470 }, enter: rise, delay: 200 }
      - { type: math, tex: "h = h_0 - (g t^2)/2", size: 50, align: left, place: { x: 64, y: 300, w: 470 }, enter: fade, delay: 300 }
      - { type: text, text: "С высоты 80 м тело упадёт за **{{round(sqrt(160/g)*10)/10}} с**", styles: { text: { size: 22, color: text2 } }, place: { x: 66, y: 470, w: 470 }, enter: fade, delay: 400 }
      - type: card
        title: Высота, м · время, с
        place: { x: 580, y: 176, w: 636, h: 470 }
        enter: rise
        delay: 250
        body:
          type: plot
          fn: 80 - g*x^2/2
          x: [0, 4]
          y: [0, 80]

  - id: cover
    template: cover
    title: Клетка — кирпичик жизни
    lead: Урок биологии для 8 класса с тестом и карточками
    meta: Школа № 14 · кабинет биологии
    visual:
      type: ladder
      items:
        - { title: Клетка, text: 10 мкм }
        - { title: Ткань, text: миллионы клеток }
        - { title: Орган, text: несколько тканей }
        - { title: Организм, text: 30 трлн клеток }

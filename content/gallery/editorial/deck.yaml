# Галерея блоков для сайта: тема «Редакция», история — стратегия компании («рыбья кость», матрица решений, рынок).
title: Стратегия на 2027 год
lang: ru
fonts:
  - { name: Literata, src: ./assets/Literata.woff2 }
  - { name: Noto Serif Display, src: ./assets/NotoSerifDisplay.woff2 }
theme:
  accent: "#B4232C"
  font: Literata
  head: Noto Serif Display
  headWeight: 600
  headSpacing: -0.01
  headScale: 0.95
  light: { bg: "#F7F3EA", tx: "#1C1917", surf: "#FFFDF8", alt: "#EFE9DC", tx2: "#3F3A35", mu: "#78716C", bd: "#E4DCCB", bd2: "#D3C9B4" }
  dark: { bg: "#171411", tx: "#EDE6DA", surf: "#211D19", alt: "#100E0C", mu: "#A8A096", bd: "#332D27", bd2: "#463E36" }
  bg: paper
  cards: flat
  radius: 0.15

slides:
  - id: fishbone
    title: Почему упали {g:duo|продажи}
    badge: Рыбья кость
    body:
      - type: fishbone
        effect: Продажи −12 % за квартал
        items:
          - { title: Люди, text: "Ушли два сильных менеджера\nНовички без наставника" }
          - { title: Процессы, text: "Счёт готовят три дня\nДолгие согласования скидок" }
          - { title: Продукт, text: "Нет мобильного приложения\nСтарый дизайн каталога" }
          - { title: Рынок, text: "Конкурент снизил цены\nСезонный спад" }
      - type: text
        size: lead
        text: "Главное — **процессы**: пока счёт готовят три дня, клиент уходит к тем, кто отвечает сразу."

  - id: decision
    title: Где открыть второй {g:duo|офис}
    badge: Матрица решений
    body:
      - type: decision
        options: [Казань, Екатеринбург, Новосибирск]
        scale: 5
        criteria:
          - { title: Аренда и зарплаты, weight: 30, scores: [4, 3, 5] }
          - { title: Найм инженеров, weight: 25, scores: [3, 5, 4] }
          - { title: Перелёт до клиентов, weight: 20, scores: [5, 4, 2] }
          - { title: Налоговые льготы, weight: 15, scores: [4, 3, 3] }
          - { title: Качество жизни, weight: 10, scores: [4, 4, 3] }

  - id: market
    title: Рынок {g:duo|онлайн-курсов}
    badge: TAM · SAM · SOM
    body:
      - type: nested
        items:
          - { title: TAM, text: "120 млрд ₽ — весь рынок онлайн-обучения" }
          - { title: SAM, text: "18 млрд ₽ — курсы для инженеров" }
          - { title: SOM, text: "1,2 млрд ₽ — наша доля за три года" }

  - id: cover
    template: cover
    title: Стратегия на 2027 год
    lead: Почему мы теряем продажи и куда растём дальше
    meta: Совет директоров · ноябрь 2026
    visual:
      type: pillars
      center: Рост ×2
      items:
        - { title: Люди, text: Наставники для новичков }
        - { title: Процессы, text: Счёт за час }
        - { title: Рынок, text: Второй офис }
